# Test database only. Its own project name and port, so it never touches other stacks.
name: mailtonic-wp
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:33071:3306"
    tmpfs:
      - /var/lib/mysql
